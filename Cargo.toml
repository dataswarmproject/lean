[workspace]
resolver = "2"

members = [
    "core/blockchain",
    "core/consensus",
    "core/state",
    "core/transaction",
    "core/crypto",
    "network/p2p",
    "network/rpc",
    "network/sync",
    "network/discovery",
    "vm/evm",
    "vm/native",
    "vm/precompiles",
    "enterprise/compliance",
    "enterprise/private-channels",
    "enterprise/institutional",
    "defi/dex",
    "defi/lending",
    "defi/stablecoin",
    "bridge/ethereum",
    "bridge/bitcoin",
    "bridge/ibc",
    "governance/dao",
    "governance/proposals",
    "cli/lean-cli",
    "node/validator",
    "node/full-node",
    "node/light-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ahmed - Digital Trendz"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dataswarmproject/lean"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
ed25519-dalek = "2.1"
sha3 = "0.10"
rand = "0.8"
blake3 = "1.5"

# Networking
libp2p = { version = "0.53", features = ["tcp", "noise", "mplex", "yamux", "gossipsub", "kad", "identify", "ping"] }

# Database
rocksdb = "0.21"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
hex = "0.4"
bs58 = "0.5"
bytes = "1.5"
clap = "4.4"

# Testing
proptest = "1.4"
criterion = "0.5"
